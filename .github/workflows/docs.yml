name: ROO documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'templates/**'
      - 'case-studies/orders-payments/**/*.md'
      - '*.md'
      - 'LICENSE*'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'templates/**'
      - 'case-studies/orders-payments/**/*.md'
      - '*.md'
      - 'LICENSE*'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out documentation sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked documentation dependencies
        run: python -m pip install --require-hashes -r website/requirements.lock
      - name: Build and validate documentation
        run: python website/build.py
      - name: Upload validated site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site-build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
