name: ROO documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'templates/**'
      - 'case-studies/orders-payments/**/*.md'
      - '*.md'
      - 'scripts/check_doc_examples.py'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE*'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-release.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'templates/**'
      - 'case-studies/orders-payments/**/*.md'
      - '*.md'
      - 'scripts/check_doc_examples.py'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE*'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing stable tag to require in the publication'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'docs-publication' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out documentation sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: false
          fetch-depth: 0 # Resolve and verify the frozen release tag as well as HEAD.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked documentation dependencies
        run: python -m pip install --require-hashes -r website/requirements.lock
      - name: Test version isolation and selector behavior
        run: |
          python -m unittest discover -s website/tests -v
          node --test website/tests/versions.test.cjs
      - name: Compile and execute chapter examples in Rust and Java
        env:
          RUSTUP_TOOLCHAIN: '1.96.0'
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python scripts/check_doc_examples.py
      - name: Capture the published release preservation baseline
        run: python website/release_tags.py capture --output .site-build/previous-publication.json
      - name: Build and validate every release edition and development
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: python website/build.py --release-tag "$RELEASE_TAG" --previous-state .site-build/previous-publication.json
      - name: Upload validated site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site-build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
