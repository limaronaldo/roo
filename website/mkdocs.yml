site_name: ROO
site_description: Relationship & Ownership Oriented design — a method independent of language, runtime, database, and protocol.
site_url: https://limaronaldo.github.io/roo/
repo_url: https://github.com/limaronaldo/roo
repo_name: limaronaldo/roo
edit_uri: ''
docs_dir: ../.site-build/content
site_dir: ../.site-build/site
strict: true
exclude_docs: |
  !/templates/
theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/roo.svg
  favicon: assets/roo.svg
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
extra_css:
  - assets/roo.css
extra_javascript:
  - assets/versions.js
extra: {}
copyright: Original ROO material — MIT OR Apache-2.0. Third-party exceptions apply.
nav:
  - Start here: index.md
  - Method:
      - Overview: overview.md
      - Foundations: docs/01-foundations.md
      - Relationship Contract: docs/02-relationship-design.md
      - Software architecture: docs/05-architecture.md
      - Technology selection: docs/technology-selection.md
  - Templates:
      - Relationship Contract: templates/relationship-contract.md
      - Architecture decision: templates/architecture-decision.md
      - Design review: templates/design-review.md
  - Design cases:
      - Payment recovery: case-studies/orders-payments/DESIGN.md
      - Authorization and revocation: case-studies/orders-payments/authorization/DESIGN.md
      - Practical adoption: docs/09-adoption-guide.md
      - Completed templates:
          - Relationship Contract: case-studies/orders-payments/adoption/relationship-contract.md
          - Architecture decision: case-studies/orders-payments/adoption/architecture-decision.md
          - Design review: case-studies/orders-payments/adoption/design-review.md
  - Implementations:
      - Implementation index: docs/implementations.md
      - Language mappings:
          - Concept atlas: docs/03-concept-atlas.md
          - Pattern catalog: docs/04-pattern-catalog.md
          - Cross-language transfer: docs/06-cross-language.md
          - Rust relationship mapping: docs/rust-relationship-mapping.md
          - Rust and object design: docs/08-rust-and-object-design.md
          - Rust laboratory: docs/laboratory.md
          - Guided learning laboratory: docs/07-learning-path.md
      - In-memory orders and payments:
          - case-studies/orders-payments/README.md
          - Shared specification: case-studies/orders-payments/SPEC.md
          - Java implementations: case-studies/orders-payments/java/README.md
          - Rust implementation: case-studies/orders-payments/rust/README.md
      - Local authorization:
          - case-studies/orders-payments/authorization/README.md
      - PostgreSQL:
          - case-studies/orders-payments/postgres/README.md
          - Persistence specification: case-studies/orders-payments/postgres/SPEC.md
          - Java implementation: case-studies/orders-payments/postgres/java/README.md
          - Rust implementation: case-studies/orders-payments/postgres/rust/README.md
      - HTTP APIs:
          - case-studies/orders-payments/http/README.md
          - HTTP specification: case-studies/orders-payments/http/SPEC.md
          - Durable authorization: case-studies/orders-payments/http/AUTHORIZATION.md
          - Java API: case-studies/orders-payments/http/java/README.md
          - Rust API: case-studies/orders-payments/http/rust/README.md
      - Executable adoption track:
          - case-studies/orders-payments/track/README.md
          - Six exercises: case-studies/orders-payments/track/EXERCISES.md
          - Track specification: case-studies/orders-payments/track/SPEC.md
          - Docker and CI: case-studies/orders-payments/track/DOCKER.md
  - Evidence:
      - Claims and limits: docs/claims-and-limits.md
      - How ROO was made: docs/how-roo-was-made.md
      - GitHub reproduction: docs/10-github-reproduction.md
  - Project:
      - Release notes: RELEASE_NOTES.md
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Releasing: RELEASING.md
      - License: license.md
      - Third-party notices: THIRD_PARTY_NOTICES.md
      - Maintaining this site: maintaining.md
