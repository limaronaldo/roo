[package]
name = "roo-http-case"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[dependencies]
axum = "=0.8.9"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tower = { version = "=0.5.3", features = ["util"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
serde_json = "=1.0.154"
serde = "=1.0.229"
postgres = "=0.19.14"
roo-postgres-case = { path = "../../postgres/rust" }

[[bin]]
name = "roo-http"
path = "src/main.rs"
